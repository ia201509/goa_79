window.addEventListener('keydown', e => {
keys[e.code] = true;
if ((e.code === 'ArrowUp' || e.code === 'Space') && !gamePaused && !gameWon) {
if (player.grounded) {
player.vy = player.jumpPower;
player.grounded = false;
jumpsLeft = doubleJumpUnlocked ? 1 : 0;
} else if (jumpsLeft > 0) {
player.vy = player.jumpPower * 0.9;
jumpsLeft--;
}
}
if (e.code === 'Enter' && document.getElementById('infoModal').style.display === 'block') {
closeModal();
}
});
window.addEventListener('keyup', e => keys[e.code] = false);
function showModal(title, text) {
gamePaused = true;
document.getElementById('modalTitle').innerText = title;
document.getElementById('modalText').innerText = text;
document.getElementById('infoModal').style.display = 'block';
}
function closeModal() {
document.getElementById('infoModal').style.display = 'none';
gamePaused = false;
}
function openQuiz() {
gamePaused = true;
const modal = document.getElementById('quizModal');
document.getElementById('quizQuestion').innerText = currentWorld.quiz.question;
document.getElementById('quizFeedback').innerText = '';
const optionsDiv = document.getElementById('quizOptions');
optionsDiv.innerHTML = '';
currentWorld.quiz.options.forEach(opt => {
const btn = document.createElement('button');
btn.className = 'btn';
btn.innerText = opt.text;
btn.onclick = () => checkAnswer(opt.correct);
optionsDiv.appendChild(btn);
});
modal.style.display = 'block';
}
function checkAnswer(isCorrect) {
const feedback = document.getElementById('quizFeedback');
if (isCorrect) {
coins += 100;
document.getElementById('coins').innerText = coins;
document.getElementById('quizModal').style.display = 'none';
if (currentWorldIndex < worlds.length - 1) {
const rewardMsg = currentWorld.rewardText;
loadWorld(currentWorldIndex + 1);
showModal('🎉 სამყარო წარმატებით გაიარე!', rewardMsg);
} else {
gameWon = true;
gamePaused = false;
}
} else {
feedback.innerText = '❌ სცადე კიდევ ერთხელ! მინიშნება: ' + currentWorld.quiz.hint;
}
}
function update() {
if (gamePaused || gameWon) return;
if (keys['ArrowLeft']) player.vx = -player.speed;
else if (keys['ArrowRight']) player.vx = player.speed;
else player.vx = 0;
player.vy += gravity;
player.x += player.vx;
player.y += player.vy;
if (player.x < 0) player.x = 0;
if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
player.grounded = false;
currentWorld.platforms.forEach(p => {
if (player.x < p.x + p.w && player.x + player.width > p.x &&
player.y + player.height > p.y && player.y + player.height - player.vy <= p.y) {
player.y = p.y - player.height;
player.vy = 0;
player.grounded = true;
jumpsLeft = doubleJumpUnlocked ? 1 : 0;
}
});
// მოსიარულე ასოები
currentWorld.letters.forEach(l => {
l.x += l.dir * 0.8;
if (l.x > l.maxX || l.x < l.minX) l.dir *= -1;
if (!l.talked && Math.abs(player.x - l.x) < 35 && Math.abs(player.y - l.y) < 40) {
l.talked = true;
coins += 25;
document.getElementById('coins').innerText = coins;
showModal(l.title, l.text);
}
});
// ცოდნის წიგნები
currentWorld.books.forEach(b => {
if (!b.collected && Math.abs(player.x - b.x) < 35 && Math.abs(player.y - b.y) < 40) {
b.collected = true;
const collectedCount = currentWorld.books.filter(item => item.collected).length;
coins += 30;
document.getElementById('books').innerText = collectedCount;
document.getElementById('coins').innerText = coins;
showModal(b.title, b.text);
}
});
// კარიბჭე
const g = currentWorld.gate;
if (player.x + player.width > g.x && player.y + player.height > g.y) {
player.x = g.x - player.width - 5;
openQuiz();
}
}
function drawBackgroundDecor() {
const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
grad.addColorStop(0, currentWorld.skyTop);
grad.addColorStop(1, currentWorld.skyBottom);
ctx.fillStyle = grad;
ctx.fillRect(0, 0, canvas.width, canvas.height);
// სამყაროს შესაბამისი ფონის ელემენტები
ctx.fillStyle = "rgba(255,255,255,0.08)";
if (currentWorld.decorType === "castle") {
ctx.fillRect(60, 180, 90, 220);
ctx.fillRect(50, 160, 25, 20);
ctx.fillRect(92, 160, 25, 20);
ctx.fillRect(135, 160, 25, 20);
} else if (currentWorld.decorType === "village") {
ctx.fillRect(80, 240, 70, 160); // კოშკი
ctx.beginPath(); ctx.moveTo(75, 240); ctx.lineTo(115, 200); ctx.lineTo(155, 240); ctx.fill();
} else if (currentWorld.decorType === "forest") {
ctx.beginPath(); ctx.moveTo(100, 400); ctx.lineTo(250, 150); ctx.lineTo(400, 400); ctx.fill();
} else if (currentWorld.decorType === "library") {
for (let i = 0; i < 5; i++) {
ctx.fillRect(70 + i * 150, 100, 40, 300); // სვეტები
}
}
}
function draw() {
drawBackgroundDecor();
// პლატფორმები
currentWorld.platforms.forEach((p, idx) => {
ctx.fillStyle = idx === 0 ? currentWorld.groundColor : currentWorld.platformColor;
ctx.fillRect(p.x, p.y, p.w, p.h);
});
// წიგნები
currentWorld.books.forEach(b => {
if (!b.collected) {
ctx.fillStyle = '#00adb5';
ctx.fillRect(b.x, b.y, 26, 28);
ctx.fillStyle = '#fff';
ctx.font = '18px Arial';
ctx.fillText('📖', b.x + 2, b.y + 21);
}
});
// მოსიარულე ასოები
currentWorld.letters.forEach(l => {
ctx.fillStyle = '#f9ed69';
ctx.font = 'bold 38px serif';
ctx.fillText(l.char, l.x, l.y + 32);
ctx.fillStyle = '#000';
ctx.fillRect(l.x + 8, l.y + 14, 3, 3);
ctx.fillRect(l.x + 16, l.y + 14, 3, 3);
});
// კარიბჭე
const g = currentWorld.gate;
ctx.fillStyle = '#e94560';
ctx.fillRect(g.x, g.y, g.w, g.h);
ctx.strokeStyle = '#f9ed69';
ctx.lineWidth = 3;
ctx.strokeRect(g.x, g.y, g.w, g.h);
ctx.fillStyle = '#fff';
ctx.font = 'bold 13px sans-serif';
ctx.fillText('კარიბჭე', g.x + 1, g.y - 8);
// მოთამაშე
ctx.fillStyle = '#ff2e63';
ctx.fillRect(player.x, player.y, player.width, player.height);
ctx.fillStyle = '#fce38a';
ctx.fillRect(player.x + 5, player.y + 5, 20, 15);
ctx.fillStyle = '#000';
ctx.fillRect(player.x + 18, player.y + 9, 3, 3);
// საიუბილეო ფინალი
if (gameWon) {
ctx.fillStyle = 'rgba(18, 18, 35, 0.95)';
ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.fillStyle = '#f9ed69';
ctx.font = 'bold 28px sans-serif';
ctx.textAlign = 'center';
ctx.fillText('🎉 გილოცავთ! დედაენის 150 წლის იუბილე! 🎉', canvas.width / 2, 75);
ctx.fillStyle = '#fff';
ctx.font = '18px sans-serif';
ctx.fillText('შენ გაიარე ოთხივე სამყარო! ქართული ანბანის 33-ვე ასო გილოცავს გამარჯვებას!', canvas.width / 2, 115);
const alphabet = 'აბგდევზთიკლმნოპჟრსტუფქღყშჩცძწჭხჯჰ'.split('');
ctx.fillStyle = '#4ecca3';
ctx.font = 'bold 28px serif';
alphabet.forEach((letter, index) => {
const col = index % 11;
const row = Math.floor(index / 11);
const lx = 155 + col * 54;
const ly = 190 + row * 60 + Math.sin(Date.now() / 180 + index) * 6;
ctx.fillText(letter, lx, ly);
});
ctx.fillStyle = '#f9ed69';
ctx.font = 'bold 22px sans-serif';
ctx.fillText("🏆 მოპოვებული წოდება: „დედაენის მცველი | სულ ქულა: ${coins} 🪙, canvas.width / 2, 405");
ctx.textAlign = 'left';
}
}
function gameLoop() {
update();
draw();
requestAnimationFrame(gameLoop);
}
loadWorld(0);
gameLoop();
